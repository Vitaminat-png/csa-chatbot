services:
  - type: web
    name: csa-chatbot
    env: docker
    plan: free
    region: frankfurt  # closest to Italy; change to oregon if preferred
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      # Guards /api/analytics/* and /api/feedback/stats. Without it those
      # endpoints let anyone read what visitors ask CSA.
      - key: ANALYTICS_TOKEN
        generateValue: true
